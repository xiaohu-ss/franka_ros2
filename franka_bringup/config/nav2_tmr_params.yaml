/**:
  bt_navigator:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      odom_topic: swerve_drive_controller/odom

  controller_server:
    ros__parameters:
      use_sim_time: false
      controller_frequency: 10.0
      odom_topic: swerve_drive_controller/odom
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["goal_checker"]
      controller_plugins: ["FollowPath"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.05
        movement_time_allowance: 100.0

      goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.01
        yaw_goal_tolerance: 0.01
        stateful: true

      FollowPath:
        plugin: "dwb_core::DWBLocalPlanner"
        debug_trajectory_details: false
        min_vel_x: -0.35
        max_vel_x: 0.35
        min_vel_y: -0.35
        max_vel_y: 0.35
        max_vel_theta: 0.5
        min_speed_xy: 0.0
        max_speed_xy: 0.35
        min_speed_theta: 0.0
        acc_lim_x: 0.4
        acc_lim_y: 0.4
        acc_lim_theta: 0.3
        decel_lim_x: -0.4
        decel_lim_y: -0.4
        decel_lim_theta: -0.3
        vx_samples: 20
        vy_samples: 20
        vtheta_samples: 20
        sim_time: 1.0
        linear_granularity: 0.05
        angular_granularity: 0.025
        transform_tolerance: 0.2
        xy_goal_tolerance: 0.01
        trans_stopped_velocity: 0.02
        short_circuit_trajectory_evaluation: true
        stateful: true
        critics:
          [
            "RotateToGoal",
            "Oscillation",
            "BaseObstacle",
            "GoalAlign",
            "PathAlign",
            "PathDist",
            "GoalDist",
          ]
        BaseObstacle.scale: 0.02
        PathAlign.scale: 32.0
        PathAlign.forward_point_distance: 0.1
        GoalAlign.scale: 24.0
        GoalAlign.forward_point_distance: 0.1
        PathDist.scale: 32.0
        GoalDist.scale: 24.0
        RotateToGoal.scale: 32.0
        RotateToGoal.slowing_factor: 5.0
        RotateToGoal.lookahead_time: -1.0

  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: false
        global_frame: odom
        robot_base_frame: base_link
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.4
        plugins: ["inflation_layer"]
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
        always_send_full_costmap: true

  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: false
        global_frame: odom
        robot_base_frame: base_link
        rolling_window: true
        width: 10
        height: 10
        resolution: 0.05
        robot_radius: 0.4
        plugins: ["inflation_layer"]
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
        always_send_full_costmap: true

  planner_server:
    ros__parameters:
      use_sim_time: false
      expected_planner_frequency: 10.0
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner/NavfnPlanner"
        tolerance: 0.5
        use_astar: false
        allow_unknown: true

  smoother_server:
    ros__parameters:
      use_sim_time: false
      smoother_plugins: ["simple_smoother"]
      simple_smoother:
        plugin: "nav2_smoother::SimpleSmoother"
        tolerance: 1.0e-10
        max_its: 1000
        do_refinement: true

  behavior_server:
    ros__parameters:
      use_sim_time: false
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      local_footprint_topic: local_costmap/published_footprint
      global_footprint_topic: global_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
      spin:
        plugin: "nav2_behaviors/Spin"
      backup:
        plugin: "nav2_behaviors/BackUp"
      drive_on_heading:
        plugin: "nav2_behaviors/DriveOnHeading"
      wait:
        plugin: "nav2_behaviors/Wait"
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.2
      simulate_ahead_time: 2.0
      max_rotational_vel: 0.5
      min_rotational_vel: 0.05
      rotational_acc_lim: 0.3

  waypoint_follower:
    ros__parameters:
      use_sim_time: false
      loop_rate: 20
      stop_on_failure: false
      waypoint_task_executor_plugin: "wait_at_waypoint"
      wait_at_waypoint:
        plugin: "nav2_waypoint_follower::WaitAtWaypoint"
        enabled: true
        waypoint_pause_duration: 200

  velocity_smoother:
    ros__parameters:
      use_sim_time: false
      smoothing_frequency: 20.0
      scale_velocities: false
      feedback: "OPEN_LOOP"
      max_velocity: [0.35, 0.35, 0.5]
      min_velocity: [-0.35, -0.35, -0.5]
      max_accel: [0.4, 0.4, 0.3]
      max_decel: [-0.4, -0.4, -0.3]
      odom_topic: swerve_drive_controller/odom
      odom_duration: 0.1
      deadband_velocity: [0.0, 0.0, 0.0]
      velocity_timeout: 1.0

  lifecycle_manager_navigation:
    ros__parameters:
      use_sim_time: false
      autostart: true
      node_names:
        [
          "controller_server",
          "smoother_server",
          "planner_server",
          "behavior_server",
          "bt_navigator",
          "waypoint_follower",
          "velocity_smoother",
        ]
